racobeu.title.description=Radioastronomia. Współpraca między europejskimi uniwersytetami: Rozwijanie umiejętności naukowych i technologicznych poprzez astronomię
racobeu.project.info=Projekt: "RACOBEU: Radioastronomia. Współpraca między uniwersytetami europejskimi: Rozwój umiejętności naukowych i technologicznych poprzez astronomię", projekt nr 2023-1-ES01-KA220-HED-000155868 (RACOBEU), realizowany jest przy wsparciu programu ERASMUS+ (KA220 Partnerstwo współpracy w szkolnictwie wyższym). Okres realizacji projektu: 11.01.2023-31.10.2026. Celem projektu jest zdefiniowanie nowego modelu edukacyjnego, który integruje wiedzę z zakresu astronomii i radioastronomii. W projekcie współpracują trzy uniwersytety, w których Obserwatorium AMU specjalizuje się w astronomii optycznej, Międzynarodowe Centrum Radioastronomii Ventspils (VSRC) specjalizuje się w radioastronomii, natomiast UPNA specjalizuje się w antenach oraz trzy szkoły średnie. W ramach projektu, we współpracy z uniwersytetami, poprzez innowacyjne metody nauczania i praktyczną działalność, nauczyciele i uczniowie zdobędą umiejętności z zakresu astronomii i radioastronomii, dążąc do stworzenia w szkołach przedmiotów do wyboru z astronomii i radioastronomii, zachęcając uczniów do zainteresowania karierami STEM. Projekt zakończy się opracowaniem wytycznych dla kursów astronomii na uczelniach, stworzeniem materiałów edukacyjnych do przedmiotów astronomii i radioastronomii w szkołach, realizowaniem działań edukacyjnych na rzecz promowania kariery STEM, a także stworzeniem społeczności do wspólnych obserwacji i realizacji programów wymiany dla uczniów, studentów, nauczycieli i wykładowców. Finansowanie projektu 250 000 euro, w tym 57 352 euro dla budżetu VUAS.

