racobeu.title.description=Radioastronomija. Sadarbība starp Eiropas universitātēm: Zinātnisko un tehnoloģisko prasmju attīstīšana, izmantojot astronomiju
racobeu.project.info=Projekts “RACOBEU: Radioastronomija. Sadarbība starp Eiropas universitātēm: Zinātnisko un tehnoloģisko prasmju attīstīšana, izmantojot astronomiju”, projekta Nr. 2023-1-ES01-KA220-HED-000155868 (RACOBEU), tiek īstenots ar programmas ERASMUS+ atbalstu (KA220 Sadarbības partnerība augstākajā izglītībā). Projekta īstenošanas periods: 11.01.2023-31.10.2026. Projekts ir vērsts uz jauna izglītības modeļa definēšanu, kurā tiek integrētas zināšanas astronomijā un radioastronomijā. Projektā sadarbojas trīs universitātes, kur AMU Observatorija specializējas optiskajā astronomijā, VeA Ventspils starptautiskais radioastronomijas centrs (VSRC) specializējas radioastronomijā, savukārt UPNA specializējas antenās un trīs vidusskolas. Projekta ietvaros, sadarbībā ar augstskolām caur inovatīvām mācību metodēm un praktisku darbošanos, skolotāji un skolēni apgūs astronomijas un radioastronomijas prasmes ar mērķi nākotnē izveidot skolās izvēles mācību priekšmetus astronomijā un radioastronomijā, veicinot skolēnu interesi par STEM karjeru. Projekta rezultātā tiks izstrādātas astronomijas kursu augstskolām vadlīnijas, izveidoti mācību materiāli astronomijas un radioastronomijas mācību priekšmetiem skolās, īstenotas izglītojošas aktivitātes izpratnes par STEM karjeru veicināšanai, kā arī kopienas izveide, kur veikt kopīgus novērojumus un īstenot skolēnu, studentu, skolotāju un pasniedzēju apmaiņas programmas. Projekta finansējums 250000 eiro, tostarp 57352 eiro VeA budžets.

