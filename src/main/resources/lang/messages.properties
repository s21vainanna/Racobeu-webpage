racobeu.title.description=Radio astronomy. Cooperation between European universities: Developing scientific and technological skills through astronomy
racobeu.project.info=Project: "RACOBEU: Radioastronomy. Collaboration between European Universities: Development of scientific and technological skills through astronomy", project No. 2023-1-ES01-KA220-HED-000155868 (RACOBEU), is implemented with the support of the ERASMUS+ program (KA220 Cooperation Partnership in Higher Education). Project implementation period: 11.01.2023-31.10.2026. The project aims to define a new educational model that integrates knowledge in astronomy and radioastronomy. Three universities collaborate in the project, where AMU Observatory specializes in optical astronomy, VUAS Ventspils International Radio Astronomy Center (VSRC) specializes in radioastronomy, while UPNA specializes in antennas and three high schools. As part of the project, in collaboration with universities, through innovative teaching methods and practical work, teachers and students will acquire skills in astronomy and radioastronomy, aiming to create elective subjects in astronomy and radioastronomy in schools, encouraging students’ interest in STEM careers. The project will result in the development of astronomy course guidelines for universities, the creation of teaching materials for astronomy and radioastronomy subjects in schools, the implementation of educational activities to promote awareness of STEM careers, as well as the creation of a community to conduct joint observations and implement exchange programs for students, teachers, and lecturers. Project funding 250,000 euros, including 57,352 euros for VUAS budget.

