racobeu.title.description=Radioastronomía. Cooperación entre universidades europeas: Desarrollo de habilidades científicas y tecnológicas a través de la astronomía
racobeu.project.info=Proyecto: "RACOBEU: Radioastronomía. Colaboración entre universidades europeas: Desarrollo de habilidades científicas y tecnológicas a través de la astronomía", proyecto Nº 2023-1-ES01-KA220-HED-000155868 (RACOBEU), se implementa con el apoyo del programa ERASMUS+ (KA220 Asociación de Cooperación en Educación Superior). Período de implementación del proyecto: 11.01.2023-31.10.2026. El proyecto tiene como objetivo definir un nuevo modelo educativo que integre conocimientos en astronomía y radioastronomía. Tres universidades colaboran en el proyecto, donde la Observatorio AMU se especializa en astronomía óptica, el Centro Internacional de Radioastronomía de Ventspils (VSRC) se especializa en radioastronomía, mientras que UPNA se especializa en antenas y tres escuelas secundarias. Como parte del proyecto, en colaboración con universidades, a través de métodos de enseñanza innovadores y trabajo práctico, los profesores y estudiantes adquirirán habilidades en astronomía y radioastronomía, con el objetivo de crear asignaturas optativas de astronomía y radioastronomía en las escuelas, fomentando el interés de los estudiantes por las carreras STEM. El proyecto resultará en el desarrollo de directrices para cursos de astronomía en universidades, la creación de materiales educativos para asignaturas de astronomía y radioastronomía en las escuelas, la implementación de actividades educativas para promover la conciencia sobre las carreras STEM, así como la creación de una comunidad para realizar observaciones conjuntas e implementar programas de intercambio para estudiantes, profesores y conferenciantes. Financiación del proyecto 250,000 euros, incluyendo 57,352 euros para el presupuesto de VUAS.

