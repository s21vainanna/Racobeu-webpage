<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: head}"></th:block>
<body>
	<th:block th:replace="~{fragments/layout :: header}"></th:block>
		
	<div class="main-content">
		<div class="container adama-section">
			<h1 th:text="#{racobeu.news}">News</h1>
		</div>

		<div class="container">
			<div th:each="newsArticle : ${newsArticles}" class="card mb-3">
				<div class="row g-0">
					<div class="col-md-8">
						<div class="card-body">
							<a th:href="@{'/news/' + ${newsArticle.newsArticleId}}">
							<h5 class="card-title" th:text="${newsArticle.title}">News title</h5>
							</a>
							<p class="card-text" th:text="${newsArticle.shortIntro}">Short intro</p>
							<p class="card-text"><small class="text-muted" th:text="${newsArticle.createdDate}">Date</small></p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
