<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/layout :: head}"></th:block>
<body>
	<th:block th:replace="~{fragments/layout :: header}"></th:block>
		
	<div class="main-content">
		<div class="container adama-section">
				<h1 th:text="${section.title}">Section Title</h1>
				<hr class="custom-separator-adama">
				<b><p th:text="${section.shortIntro}">Short text intro</p></b>
				<p th:text="${section.text}">Long text</p>
		</div>
	</div>
	
	<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
